---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: agents.agents.recif.dev
spec:
  group: agents.recif.dev
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSpec defines the desired state of an Agent
            properties:
              backgroundModel:
                description: |-
                  BackgroundModel is a "provider:model_id" URI (e.g. "ollama:qwen3.5:4b",
                  "openai:gpt-4o-mini") used for cheap background tasks — memory
                  extraction, follow-up suggestions, auto-generated conversation titles.
                  When empty, background tasks reuse the main chat model, which can be
                  painfully slow with local 35B+ models.
                type: string
              canary:
                description: Canary deployment configuration
                properties:
                  enabled:
                    type: boolean
                  image:
                    type: string
                  modelId:
                    type: string
                  modelType:
                    type: string
                  skills:
                    items:
                      type: string
                    type: array
                  systemPrompt:
                    type: string
                  tools:
                    items:
                      type: string
                    type: array
                  version:
                    type: string
                  weight:
                    format: int32
                    type: integer
                required:
                - enabled
                - weight
                type: object
              channel:
                default: rest
                type: string
              credentialSecret:
                description: |-
                  CredentialSecret is the name of a Secret containing a GCP/AWS credentials file to mount.
                  Defaults to "gcp-adc" when empty (backward compatible).
                type: string
              databaseUrl:
                type: string
              description:
                description: Human-readable description of what this agent does
                type: string
              envSecrets:
                description: |-
                  EnvSecrets is a list of Secret names whose data will be injected as env vars.
                  Defaults to ["agent-env"] when empty (backward compatible).
                items:
                  type: string
                type: array
              evalSampleRate:
                description: Percentage of production traces to auto-evaluate (0-100,
                  0=disabled)
                format: int32
                type: integer
              framework:
                enum:
                - corail
                - adk
                - langchain
                - crewai
                - autogen
                - custom
                type: string
              gcpServiceAccount:
                description: |-
                  GCPServiceAccount is the GCP service account email (e.g. "my-agent@project.iam.gserviceaccount.com").
                  When set, the operator looks for a Secret named "{agent}-gcp-sa" with key "credentials.json"
                  containing the service account key, mounts it, and sets GOOGLE_APPLICATION_CREDENTIALS + GOOGLE_CLOUD_PROJECT.
                type: string
              image:
                default: corail:latest
                type: string
              judgeModel:
                description: Model ID for LLM-judge evaluation (e.g. "openai:/gpt-4o-mini")
                type: string
              knowledgeBases:
                description: Knowledge base IDs for RAG strategy
                items:
                  type: string
                type: array
              modelId:
                default: stub-echo
                type: string
              modelType:
                default: stub
                type: string
              name:
                type: string
              replicas:
                default: 1
                format: int32
                maximum: 10
                minimum: 0
                type: integer
              skills:
                description: Skill IDs assigned to this agent
                items:
                  type: string
                type: array
              storage:
                description: |-
                  Storage backend for conversations. When empty, the operator picks
                  postgresql if a DATABASE_URL is configured on the operator, otherwise
                  memory. Explicit values win over the auto-default.
                enum:
                - memory
                - postgresql
                type: string
              strategy:
                default: simple
                type: string
              suggestions:
                description: Static suggestions shown on empty chat (JSON array of
                  strings)
                type: string
              suggestionsProvider:
                description: 'Suggestions provider: "llm" (dynamic follow-ups) or
                  "static" (from config)'
                type: string
              systemPrompt:
                type: string
              tools:
                description: List of Tool CRD names assigned to this agent
                items:
                  type: string
                type: array
              version:
                description: Semantic version string (e.g. "0.1.0")
                type: string
            required:
            - framework
            - name
            type: object
          status:
            description: AgentStatus defines the observed state of Agent
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                type: string
              phase:
                enum:
                - Pending
                - Running
                - Failed
                - Terminated
                type: string
              replicas:
                format: int32
                type: integer
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
